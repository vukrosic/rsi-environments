[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-kernel-env"
version = "0.1.1"
description = "Six correctness-gated kernel optimization tasks for research agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kernel-env = "kernel_env.cli:main"

[tool.setuptools.packages.find]
include = ["kernel_env*", "suite*"]

[tool.setuptools.package-data]
kernel_env = ["starters/*.py"]
suite = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
